name: Heal Nix Cache

# The S3 lifecycle rule expires NARs after 35 days; current closures must keep
# working. This job re-pushes every config's closure from its last-resolved
# lock — nix copy only uploads paths the lifecycle actually expired.

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heal-cache
  cancel-in-progress: false

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@v10
      - uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            nix-path = nixpkgs=channel:nixos-unstable
      - name: Install AWS CLI
        run: nix profile install nixpkgs#awscli2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Download config locks
        run: aws s3 sync "s3://icedos-nix-cache-fyi/locks/" build/locks/ --region eu-central-1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Re-push current closures
        run: nix run .#build
        env:
          ICEDOS_HEAL: 1
          ICEDOS_SUBSTITUTER: ${{ vars.ICEDOS_SUBSTITUTER }}
          ICEDOS_SIGNING_KEY: ${{ secrets.ICEDOS_SIGNING_KEY }}
          ICEDOS_S3_URL: "s3://icedos-nix-cache-fyi?region=eu-central-1"
          ICEDOS_S3_BUCKET: icedos-nix-cache-fyi
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: eu-central-1
          AWS_DEFAULT_REGION: eu-central-1
          ICEDOS_WORKBASE: /mnt/icedos-work-heal
