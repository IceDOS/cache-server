name: Nix Build

# Dispatch-only: auto-update.yml after a lock bump, and the mesa / shadps4 updaters in
# hardware / apps. A push trigger would double-build on top of those dispatches.
#
# `force` repairs the cache: a config with a present toplevel but an incomplete closure
# would otherwise be skipped forever.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and re-push every config even if its closure is already cached"
        type: boolean
        default: false

permissions:
  actions: write

concurrency:
  # Queue instead of cancelling — a cancel kills an in-progress kernel compile.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reclaim /mnt for a large /nix store (runner / is ~17 GB). MUST precede the Nix install.
      # nix-permission-edict hands the runner user /nix so the cache restore can write into it.
      - uses: wimpysworld/nothing-but-nix@v10
        with:
          hatchet-protocol: 'rampage'
          nix-permission-edict: true
          # rampage otherwise reclaims / to 2 GB, too small for the post-run cache.tzst
          # (~4 GB). The build still has ~100 GB across / + /mnt.
          root-safe-haven: '10240'
      # Single-user: the runner owns /nix, so cache-nix-action can restore into it.
      # Multi-user install-nix-action leaves it root-owned -> "Permission denied".
      - uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            nix-path = nixpkgs=channel:nixos-unstable
            keep-env-derivations = true
            keep-outputs = true
            max-jobs = auto
            cores = 0
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'config/*.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # Below GitHub's 10 GB/repo cache ceiling.
          gc-max-store-size: 8000000000
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - name: Attic login
        run: |
          nix profile install nixpkgs#attic-client
          attic login icedos "$ICEDOS_SUBSTITUTER" "$ATTIC_TOKEN"
          attic cache info icedos
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
          ICEDOS_SUBSTITUTER: ${{ vars.ICEDOS_SUBSTITUTER }}
      - name: Test cache server
        run: |
          # A POST bypasses the nginx GET cache and validates the token (401 on bad).
          echo "Probing atticd API via $ICEDOS_SUBSTITUTER ..."
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            -X POST \
            -H "Authorization: Bearer $ATTIC_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"cache":"icedos","store_path_hashes":["00000000000000000000000000000000"]}' \
            -w "\nHTTP %{http_code}\n" \
            "$ICEDOS_SUBSTITUTER/_api/v1/get-missing-paths"
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
          ICEDOS_SUBSTITUTER: ${{ vars.ICEDOS_SUBSTITUTER }}
      # Stable, NOT mktemp: the work dir is baked into the closure, so a random path
      # re-hashes ~38 paths per config. On /mnt because builds inherit TMPDIR from here.
      - name: Prepare deterministic work dir
        run: |
          sudo mkdir -p /mnt/icedos-work
          sudo chmod 1777 /mnt/icedos-work
      - name: Run Nix Build
        run: nix run .#build
        env:
          ICEDOS_SUBSTITUTER: ${{ vars.ICEDOS_SUBSTITUTER }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
          ICEDOS_WORKBASE: /mnt/icedos-work
          ICEDOS_FORCE_BUILD: ${{ inputs.force && '1' || '' }}
