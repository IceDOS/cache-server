name: Cache Prune

# Deletes cache entries cache.nixos.org already serves, unsigned ones no client
# can use, narinfos whose NAR is gone, NARs nothing points at, and paths outside
# the active per-config roots. Dry run unless `apply` is checked.
on:
  schedule:
    # Monday 01:00 UTC, safely before heal-cache at Monday 04:23 UTC.
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      sets:
        description: "Which sets to delete"
        type: choice
        default: upstream,unsigned,dangling,orphan
        options:
          - upstream,unsigned,dangling,orphan
          - stale,dangling,orphan
          - stale
          - stale,upstream,unsigned,dangling,orphan
          - dangling,orphan
          - upstream,unsigned
          - upstream
          - unsigned
          - dangling
          - orphan
      apply:
        description: "Actually delete (unchecked = dry run)"
        type: boolean
        default: false

run-name: >-
  ${{ github.event_name == 'schedule'
      && ((vars.PRUNE_SCHEDULED_APPLY == 'true' && 'prune: scheduled weekly DELETE stale,dangling,orphan')
          || 'prune: scheduled weekly dry run stale,dangling,orphan')
      || (inputs.apply && format('prune: DELETE {0}', inputs.sets)
          || format('prune: dry run {0}', inputs.sets)) }}

permissions:
  contents: read

# Nix Build's own group, so a prune never overlaps a build pushing to the bucket.
concurrency:
  group: Nix Build
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Audit
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: eu-central-1
          AWS_DEFAULT_REGION: eu-central-1
          ICEDOS_MIN_LIVE_RATIO: ${{ vars.ICEDOS_MIN_LIVE_RATIO || '' }}
        run: ./scripts/cache-audit.sh cache-audit | tee audit.txt
      - name: Prune
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: eu-central-1
          AWS_DEFAULT_REGION: eu-central-1
          PRUNE_SETS: ${{ github.event_name == 'schedule' && 'stale,dangling,orphan' || inputs.sets }}
        run: |
          apply_arg=()
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ vars.PRUNE_SCHEDULED_APPLY }}" = "true" ]; then
              apply_arg=(--apply)
            else
              echo "PRUNE_SCHEDULED_APPLY is not 'true'; scheduled run defaults to dry run"
            fi
          elif [ "${{ inputs.apply }}" = "true" ]; then
            apply_arg=(--apply)
          fi
          ./scripts/cache-prune.sh cache-audit \
            --sets "$PRUNE_SETS" "${apply_arg[@]}" \
            2>&1 | tee prune.txt
          {
            if [ "${#apply_arg[@]}" -gt 0 ]; then
              echo "### Cache prune (applied)"
            else
              echo "### Cache prune (dry run)"
            fi
            echo '```'
            cat audit.txt prune.txt
            echo '```'
            echo 'Purge the CDN after an applied run.'
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: cache-prune-lists
          path: |
            cache-audit/*.txt
          retention-days: 7
