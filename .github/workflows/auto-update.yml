name: Auto Update flake.lock

# PRs, never direct commits: each change source (nixpkgs bump, each tracked input) gets
# its own branch + PR. nix-build.yml builds the PR, pushes to the cache, and merges into
# main only on success, so main always describes a fully cached state.
#
# Branch handling is idempotent: identical content on top of the same main commit is a
# no-op, so a 30-min run with nothing new never re-queues a build.

on:
  schedule:
    # GitHub may delay or skip scheduled runs, and they only fire on the default branch.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  issues: write

# Never run two updaters at once; let an in-flight one finish.
concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            nix-path = nixpkgs=channel:nixos-unstable

      - name: Update nixpkgs and detect change
        id: update
        run: |
          old=$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)
          nix flake update
          new=$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)
          echo "nixpkgs: $old -> $new"
          if [ "$old" = "$new" ]; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
            echo "old=${old:0:12}" >>"$GITHUB_OUTPUT"
            echo "short=${new:0:12}" >>"$GITHUB_OUTPUT"
          fi

      - name: Check tracked inputs
        id: inputs
        if: always()
        run: |
          changed_input_names=()
          changed_input_details=()
          revs_json='{}'

          while IFS= read -r name; do
            configs_json=$(TRACKED_NAME="$name" python3 -c "
          import tomllib, json, os
          with open('tracked-inputs.toml', 'rb') as f:
              data = tomllib.load(f)
          for entry in data['trackedInputs']:
              if entry['name'] == os.environ['TRACKED_NAME']:
                  print(json.dumps(entry['configs']))
                  break
          ") || continue
            configs=($(echo "$configs_json" | jq -r '.[]'))

            for cfg in "${configs[@]}"; do
              work="$(mktemp -d -t tracked-XXXXXX)"

              cp "config/$cfg" "$work/config.toml"
              rsync -a --exclude=build --exclude=.git --exclude=state ./ "$work/"

              (
                cd "$work"
                nix run .#icedos -- --genflake-only 2>&1 || exit 1
                cd build/.state
                nix flake lock 2>&1 || exit 1
              ) || { rm -rf "$work"; continue; }

              if [ -f "$work/build/.state/flake.lock" ]; then
                # Shared resolution logic (leaf-node lookup, follows skip) lives in
                # scripts/tracked-revs.py — nix-build.yml reuses it to pin built revs.
                resolved=$(python3 scripts/tracked-revs.py extract --lock "$work/build/.state/flake.lock" --names "$name")
                input_key=$(jq -r --arg n "$name" '.[$n].key // ""' <<<"$resolved")
                new_rev=$(jq -r --arg n "$name" '.[$n].rev // ""' <<<"$resolved")

                if [ -n "$new_rev" ]; then
                  # The working file stays pristine; it is read, never mutated.
                  old_rev=$(jq -r --arg k "$input_key" 'if (.[$k] | type) == "object" then .[$k].rev else (.[$k] // "") end' state/tracked-inputs.json 2>/dev/null)

                  if [ "$new_rev" != "$old_rev" ]; then
                    changed_input_names+=("$name")
                    if [ -n "$old_rev" ]; then
                      changed_input_details+=("$name: ${old_rev:0:12} -> ${new_rev:0:12}")
                    else
                      changed_input_details+=("$name: ${new_rev:0:12}")
                    fi
                    # Keyed by name: an input with several configs keeps only its latest rev.
                    if [ -n "$old_rev" ]; then old_json="\"$old_rev\""; else old_json=null; fi
                    revs_json=$(jq -c --arg n "$name" --arg k "$input_key" --arg r "$new_rev" --argjson o "$old_json" \
                      '. + {($n): {name:$n, key:$k, rev:$r, old:$o}}' <<<"$revs_json")
                  fi
                fi
              fi

              rm -rf "$work"
            done
          done < <(python3 -c "
          import tomllib
          with open('tracked-inputs.toml', 'rb') as f:
              data = tomllib.load(f)
          for entry in data['trackedInputs']:
              print(entry['name'])
          ")

          if [ ${#changed_input_names[@]} -gt 0 ]; then
            echo "changed=true" >>"$GITHUB_OUTPUT"
            {
              echo "details<<DETAILS_EOF"
              printf '%s\n' "${changed_input_details[@]}"
              echo "DETAILS_EOF"
            } >>"$GITHUB_OUTPUT"
            {
              echo "revs<<REVS_EOF"
              echo "$revs_json"
              echo "REVS_EOF"
            } >>"$GITHUB_OUTPUT"
          else
            echo "changed=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Mint app token
        id: app-token
        if: steps.update.outputs.changed == 'true' || steps.inputs.outputs.changed == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DISPATCH_APP_ID }}
          private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}
          owner: IceDOS
          repositories: cache-server

      - name: Upsert update branches and pull requests
        if: steps.update.outputs.changed == 'true' || steps.inputs.outputs.changed == 'true'
        uses: actions/github-script@v7
        env:
          REVS: ${{ steps.inputs.outputs.revs }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const fs = require('fs');

            const mainSha = (await github.rest.git.getRef({ owner, repo, ref: 'heads/main' })).data.object.sha;

            async function blobShaOf(content) {
              return (await github.rest.git.createBlob({ owner, repo, content, encoding: 'utf-8' })).data.sha;
            }

            // Branch head/parent plus the blob sha of `path` at head, or null when absent.
            async function branchState(branch, path) {
              try {
                const ref = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
                const commit = await github.rest.git.getCommit({ owner, repo, commit_sha: ref.data.object.sha });
                let blob = null;
                try {
                  const file = await github.rest.repos.getContent({ owner, repo, path, ref: `heads/${branch}` });
                  if (!Array.isArray(file.data)) blob = file.data.sha;
                } catch (e) {
                  if (e.status !== 404) throw e;
                }
                return { head: ref.data.object.sha, parent: commit.data.parents[0]?.sha, blob };
              } catch (e) {
                if (e.status === 404) return null;
                throw e;
              }
            }

            async function upsert({ branch, path, content, message, title, body }) {
              const blobSha = await blobShaOf(content);
              const cur = await branchState(branch, path);

              // Identical content on top of the same main commit: the open PR already
              // triggers a build, and another force-push would re-queue it for nothing.
              if (cur && cur.blob === blobSha && cur.parent === mainSha) {
                core.info(`${branch}: already up to date`);
                return;
              }

              const tree = await github.rest.git.createTree({
                owner, repo, base_tree: mainSha,
                tree: [{ path, mode: '100644', type: 'blob', sha: blobSha }],
              });
              const commit = await github.rest.git.createCommit({
                owner, repo, message, tree: tree.data.sha, parents: [mainSha],
              });

              if (cur) {
                await github.rest.git.updateRef({ owner, repo, ref: `heads/${branch}`, sha: commit.data.sha, force: true });
              } else {
                await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: commit.data.sha });
              }

              const head = `${owner}:${branch}`;
              const prs = (await github.rest.pulls.list({ owner, repo, head, state: 'all', per_page: 20 })).data;
              const open = prs.find(p => p.state === 'open');
              if (open) {
                if (open.title !== title || open.body !== body) {
                  await github.rest.pulls.update({ owner, repo, pull_number: open.number, title, body });
                }
                core.info(`${branch}: PR #${open.number} refreshed`);
              } else {
                // Reopen a closed-but-unmerged PR; a merged one can never reopen.
                const closed = prs.find(p => p.state === 'closed' && !p.merged_at);
                if (closed) {
                  try {
                    await github.rest.pulls.update({ owner, repo, pull_number: closed.number, state: 'open', title, body });
                    core.info(`${branch}: reopened PR #${closed.number}`);
                  } catch (e) {
                    // Reopening fails once the head was force-pushed while closed.
                    const pr = await github.rest.pulls.create({ owner, repo, head, base: 'main', title, body });
                    core.info(`${branch}: reopen of #${closed.number} failed (${e.status}); opened PR #${pr.data.number}`);
                  }
                } else {
                  const pr = await github.rest.pulls.create({ owner, repo, head, base: 'main', title, body });
                  core.info(`${branch}: opened PR #${pr.data.number}`);
                }
              }
            }

            if ('${{ steps.update.outputs.changed }}' === 'true') {
              const old = '${{ steps.update.outputs.old }}';
              const short = '${{ steps.update.outputs.short }}';
              await upsert({
                branch: 'update/nixpkgs',
                path: 'flake.lock',
                content: fs.readFileSync('flake.lock', 'utf8'),
                message: `update(nixpkgs): ${old} -> ${short}`,
                title: `update(nixpkgs): ${old} -> ${short}`,
                body: `nixpkgs: ${old} -> ${short}`,
              });
            }

            const base = JSON.parse(fs.readFileSync('state/tracked-inputs.json', 'utf8'));
            for (const r of Object.values(JSON.parse(process.env.REVS || '{}'))) {
              // Spread-copy per input: each PR must carry only its own rev change.
              const detail = r.old ? `${r.name}: ${r.old.slice(0, 12)} -> ${r.rev.slice(0, 12)}` : `${r.name}: ${r.rev.slice(0, 12)}`;
              await upsert({
                branch: `update/input-${r.name}`,
                path: 'state/tracked-inputs.json',
                content: JSON.stringify({ ...base, [r.key]: r.rev }, null, 2) + '\n',
                message: `update(inputs): ${r.name}\n\n${detail}`,
                title: `update(inputs): ${r.name}`,
                body: detail,
              });
            }
      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const label = 'ci-failure';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = `**${context.workflow}** failed on \`${context.ref}\` (${context.eventName}) at ${new Date().toISOString()}\n${runUrl}\ncc @IceDBorn`;
            const existing = (await github.rest.issues.listForRepo({ owner, repo, labels: label, state: 'open', per_page: 1 })).data;
            if (existing.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing[0].number, body });
              core.info(`reported on #${existing[0].number}`);
            } else {
              await github.rest.issues.create({ owner, repo, title: 'CI failure reports', body, labels: [label] });
              core.info('created the rolling failure-report issue');
            }
