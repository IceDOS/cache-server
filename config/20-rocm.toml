[[icedos.repositories]]
url = "github:icedos/hardware"
fetchDependencies = false
modules = ["radeon"]

[icedos.hardware.graphics.radeon]
rocm = true

# Compile the rocmSupport variants once here; cache.nixos.org carries none of them.
[icedos.system]
packages = [
  "rocmPackages.clr",
  "rocmPackages.rocminfo",
  "rocmPackages.rocblas",
  "rocmPackages.hipblas",
  "rocmPackages.rocm-smi",
]
version = "26.05"
