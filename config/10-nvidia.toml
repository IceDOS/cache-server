[[icedos.repositories]]
url = "github:icedos/hardware"
fetchDependencies = false
modules = ["nvidia"]

[icedos.hardware.graphics.nvidia]
cuda = true

# Compile the cudaSupport variant once here instead of on every user's machine.
[icedos.system]
packages = [
  "cudaPackages.cudatoolkit",
]
version = "26.05"
