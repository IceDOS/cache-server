# The JWT HS256 secret comes from ATTIC_SERVER_TOKEN_HS256_SECRET_BASE64, not this file
# (`openssl rand 64 | base64 -w0`) — Attic moves that key between schema versions.

# Localhost only; Caddy and nginx are the public faces.
listen = "127.0.0.1:8080"

# Without this atticd synthesizes the endpoint from the Host header and emits wrong URLs.
api-endpoint = "https://icedos.mirrors.knp.one/"

[database]
# /nix/attic already holds the cache from the old containerised stack.
url = "sqlite:///nix/attic/server.db?mode=rwc"
# Saves a query/minute on a single-core box.
heartbeat = false

[storage]
type = "local"
path = "/nix/attic/storage"

# Content-addressed chunking = global dedup. Larger chunks trade dedup ratio for fewer
# reassembly operations per NAR; this box is CPU-bound, not storage-bound.
[chunking]
nar-size-threshold = 131072
min-size = 32768
avg-size = 131072
max-size = 524288

# CPU overhead is the scarce resource here, not disk.
[compression]
type = "none"

# Access-based: an object ages out only if it was neither pulled nor re-pushed for the
# retention period. Zero/unset disables time-based GC entirely, so this key is required.
[garbage-collection]
interval = "12 hours"
default-retention-period = "30d"
