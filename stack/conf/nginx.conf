# Disk cache in front of atticd, shielding its single core from repeat NAR reassembly.
# Localhost only; Caddy is the TLS edge. Self-contained: no /etc/nginx, logs to stderr.
user root;
worker_processes 1;

error_log stderr warn;
pid /run/icedos-nginx.pid;

events {
  worker_connections 512;
  multi_accept on;
}

http {
  default_type application/octet-stream;

  # CPU/IO-bound box; per-request logs have no value for a cache.
  access_log off;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;

  # NARs stream through; the disk cache handles storage.
  proxy_buffering on;
  proxy_buffer_size 4k;
  proxy_buffers 4 16k;
  proxy_busy_buffers_size 32k;
  proxy_max_temp_file_size 64m;

  # Store objects are immutable, but a 404 must not stick or a later push stays invisible.
  map $status $nar_cache_control {
    default "no-cache";
    200     "public, max-age=31536000, immutable";
    301     "public, max-age=31536000, immutable";
    302     "public, max-age=31536000, immutable";
  }

  # Entries idle for >7 days are evicted and re-fetched from atticd if pulled again.
  proxy_cache_path /nix/nar-cache levels=1:2 keys_zone=nar-cache:8m max_size=16g inactive=7d use_temp_path=off;

  upstream atticd {
    server 127.0.0.1:8080;
    keepalive 8;
  }

  server {
    listen unix:/run/icedos-nginx.sock;

    # Fewer open/stat/close syscalls per hit, which matters on one core.
    open_file_cache max=4096 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;

    location / {
      proxy_cache nar-cache;
      proxy_pass http://atticd;
      proxy_http_version 1.1;
      # Clearing Connection lets keep-alive to atticd use the pool above.
      proxy_set_header Connection "";
      proxy_set_header Host $host;

      # atticd reassembles each NAR from chunks per request; cache the result so repeat
      # pulls don't re-hit it. Caddy sends uploads straight to atticd, so this is GETs only.
      proxy_ignore_headers X-Accel-Expires Expires Cache-Control Set-Cookie;
      proxy_cache_valid 200 301 302 365d;
      proxy_cache_valid 404 1m;

      # Coalesce concurrent misses. Long timeouts: a cold kernel/cuda NAR can take >60s
      # to reassemble on one core, and the 60s default would 504 and stampede atticd.
      proxy_cache_lock on;
      proxy_cache_lock_timeout 300s;
      proxy_read_timeout 300s;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

      add_header Cache-Control $nar_cache_control always;
      add_header X-Cache-Status $upstream_cache_status always;
    }
  }
}
